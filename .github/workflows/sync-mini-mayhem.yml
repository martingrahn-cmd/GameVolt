name: Sync Mini Mayhem

# Mini Mayhem is developed in its own repository (martingrahn-cmd/minigolf-3d)
# and deployed there to GitHub Pages. This keeps /mini-mayhem/ on GameVolt in
# step with its main branch: the game's Vite build, with GameVolt's head and
# SEO block on top (scripts/publish-mini-mayhem.py). Edit those templates here,
# never the published copy, which the next sync replaces.

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-mini-mayhem
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Mini Mayhem
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out GameVolt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out Mini Mayhem main
        uses: actions/checkout@v7
        with:
          repository: martingrahn-cmd/minigolf-3d
          ref: main
          path: .mini-mayhem-source

      - name: Check whether Mini Mayhem changed
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C .mini-mayhem-source rev-parse HEAD)"
          published_sha="$(jq -r '.sourceCommit // empty' mini-mayhem/source.json 2>/dev/null || true)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [ "$source_sha" = "$published_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .mini-mayhem-source/package-lock.json

      - name: Build the game
        if: steps.version.outputs.changed == 'true'
        working-directory: .mini-mayhem-source
        # The build stamps its version from GITHUB_SHA when set, which here is
        # GameVolt's commit; empty, it reads the game checkout's own HEAD.
        run: |
          npm ci
          npm test
          GITHUB_SHA= npm run build

      - name: Publish into GameVolt
        if: steps.version.outputs.changed == 'true'
        run: python3 scripts/publish-mini-mayhem.py .mini-mayhem-source/dist .mini-mayhem-source "${{ steps.version.outputs.source_sha }}"

      - name: Verify the published page
        if: steps.version.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          test -f mini-mayhem/index.html
          test -f mini-mayhem/version.json
          test -f mini-mayhem/preview.mp4
          test -d mini-mayhem/assets/models
          grep -q 'https://gamevolt.io/mini-mayhem/' mini-mayhem/index.html
          grep -q '/sdk/gamevolt.js' mini-mayhem/index.html
          grep -q 'id="seo-content"' mini-mayhem/index.html
          test "$(grep -c '<title>' mini-mayhem/index.html)" = 1
          grep -q "\"sourceCommit\": \"$SOURCE_SHA\"" mini-mayhem/source.json

      - name: Commit published build
        if: steps.version.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mini-mayhem
          if git diff --cached --quiet; then
            echo "The portal build is already current."
            exit 0
          fi
          git commit -m "Publish Mini Mayhem ${SOURCE_SHA:0:7}"
          git pull --rebase origin main
          git push
