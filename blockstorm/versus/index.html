<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BlockStorm Versus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1221">
<!-- Not linked from anywhere and not finished: keep it out of search until it is. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  :root { --ink: #c8e6e3; --dim: #7ab5b0; --line: #2d5a5a; --bg: #0f1221; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  canvas#gameCanvas { display: block; }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 10, 20, 0.86); z-index: 20; padding: 20px; }
  .overlay.hidden { display: none; }
  .panel { width: min(460px, 100%); background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    border-radius: 16px; padding: 26px 24px; text-align: center; }
  .panel h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: 1px; }
  .panel .sub { color: var(--dim); font-size: 0.85rem; margin-bottom: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  .btn { font: inherit; font-weight: 700; cursor: pointer; padding: 11px 18px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--ink); }
  .btn:hover:not(:disabled) { border-color: var(--ink); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.tiny { padding: 8px 13px; font-size: 0.8rem; }
  #codeInput { font: inherit; font-weight: 700; font-size: 1.1rem; letter-spacing: 6px; width: 132px;
    text-align: center; text-transform: uppercase; color: #fff; background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 8px; outline: none; }
  #codeBox { margin: 18px 0 8px; }
  #codeBox.hidden { display: none; }
  #code { font-size: 2.4rem; font-weight: 800; letter-spacing: 10px; padding-left: 10px; color: #f5d63d;
    font-family: 'Courier New', monospace; }
  .hint { color: var(--dim); font-size: 0.78rem; margin: 6px 0 12px; line-height: 1.5; }
  #status { min-height: 1.2em; color: var(--dim); font-size: 0.85rem; margin-top: 14px; }
  #status.error { color: #e85b6c; }

  /* Opponent board. The renderer owns the whole canvas and centres the
     playfield inside it, so this is positioned from that layout (see
     placeHud) rather than pinned to a window corner. */
  #hud { position: fixed; left: 0; top: 0; z-index: 10; text-align: center; display: none; }
  #hud.on { display: block; }
  #oppCanvas { background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 8px;
    display: block; margin: 0 auto; }
  #oppLabel { font-size: 0.7rem; letter-spacing: 2px; color: var(--dim); margin-bottom: 5px; }
  #pending { margin-top: 8px; font-size: 0.78rem; color: var(--dim); }
  #pending b { color: #e85b6c; font-size: 1.1rem; }
  #sent { font-size: 0.72rem; color: var(--dim); margin-top: 2px; }

  /* No gutter wide enough: a flat strip over the top of the board, where
     the stack rarely reaches. */
  #hud.on.strip { display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: rgba(8,10,20,0.6); border-radius: 9px; padding: 5px; }
  /* Narrow enough to stay over the board's left edge: the next piece
     spawns in the middle columns and must not be hidden. */
  #hud.strip #oppLabel, #hud.strip #sent, #hud.strip #pending .w { display: none; }
  #hud.strip #oppCanvas { border-radius: 4px; }
  #hud.strip #pending { margin: 0; white-space: nowrap; font-size: 0.68rem; }
  #hud.strip #pending::before { content: '▼ '; color: var(--dim); }
  #hud.strip #pending b { font-size: 0.95rem; }

  /* ---- reactions ----------------------------------------------------
     Everything below is feedback: the only warning you had before was a
     number changing. */

  /* Incoming garbage, as a bar down the edge of your own board. It fills
     while the queue waits out its window and pulses once it is armed —
     that pulse is your cue to clear something and cancel it. */
  #dangerBar { position: fixed; z-index: 9; display: none; border-radius: 4px;
    background: rgba(255,255,255,0.05); overflow: hidden; }
  #dangerBar.on { display: block; }
  #dangerFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: linear-gradient(180deg, #ff9f43, #e85b6c);
    box-shadow: 0 0 12px rgba(232,91,108,0.55); transition: height 0.12s linear; }
  #dangerBar.armed #dangerFill { animation: danger-pulse 0.34s infinite alternate; }
  @keyframes danger-pulse { from { opacity: 0.5; } to { opacity: 1; } }

  /* Floating callouts over the board: what you just did, what just hit you. */
  #log { position: fixed; z-index: 11; pointer-events: none; text-align: center; }
  .logline { font-weight: 800; letter-spacing: 2px; font-size: 0.95rem; color: #f5d63d;
    text-shadow: 0 2px 12px rgba(0,0,0,0.75); animation: log-rise 1.35s ease-out forwards; }
  .logline.inbound { color: #e85b6c; }
  .logline.cancel { color: #45d9c8; }
  .logline small { display: block; font-size: 0.6rem; letter-spacing: 3px; color: var(--dim); font-weight: 700; }
  @keyframes log-rise {
    0%   { opacity: 0; transform: translateY(12px) scale(0.85); }
    14%  { opacity: 1; transform: translateY(0) scale(1.08); }
    28%  { transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-52px); }
  }

  /* The opponent's board takes the hit you just sent. */
  #hud.hit { animation: hud-shake 0.36s ease-out; }
  @keyframes hud-shake {
    10% { transform: translate(-4px, 2px); }  30% { transform: translate(5px, -2px); }
    50% { transform: translate(-4px, -2px); } 70% { transform: translate(3px, 2px); }
    100% { transform: none; }
  }
  #oppCanvas.flash { border-color: #f5d63d; box-shadow: 0 0 20px rgba(245,214,61,0.55); }

  /* Taking garbage knocks the whole view. */
  body.jolt { animation: jolt 0.3s ease-out; }
  @keyframes jolt {
    20% { transform: translateY(5px); } 55% { transform: translateY(-3px); } 100% { transform: none; }
  }

  #flash { position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0; }
  #flash.go { animation: flash 0.55s ease-out; }
  @keyframes flash { 0% { opacity: 0.55; } 100% { opacity: 0; } }

  /* ---- the ending --------------------------------------------------- */
  #result .panel { animation: pop 0.5s cubic-bezier(0.2, 1.35, 0.45, 1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(0.84) translateY(16px); } to { opacity: 1; transform: none; } }
  #resultTitle { font-size: 2.4rem; letter-spacing: 4px; text-transform: uppercase; }
  #result.win #resultTitle { color: #45d9c8; animation: win-glow 1.5s ease-in-out infinite alternate; }
  #result.lose #resultTitle { color: #e85b6c; animation: lose-drop 0.6s ease-out both; }
  #result.draw #resultTitle { color: #f5d63d; animation: lose-drop 0.6s ease-out both; }
  @keyframes win-glow {
    from { text-shadow: 0 0 14px rgba(69,217,200,0.35); }
    to   { text-shadow: 0 0 34px rgba(69,217,200,0.85), 0 0 60px rgba(69,217,200,0.35); }
  }
  @keyframes lose-drop {
    0% { transform: translateY(-14px) rotate(-2deg); opacity: 0; }
    60% { transform: translateY(4px) rotate(1deg); opacity: 1; }
    100% { transform: none; }
  }
  #stats { color: var(--dim); font-size: 0.78rem; letter-spacing: 1px; margin: 0 0 6px; }
  #stats b { color: var(--ink); font-size: 1rem; }
  #series { color: var(--dim); font-size: 0.72rem; letter-spacing: 2px; margin: 0 0 16px; }
  #series b { color: #f5d63d; font-size: 0.95rem; }
  #series.hidden { display: none; }

  /* Emoji after the whistle: the only thing you can say to each other. */
  #reactRow { display: flex; gap: 6px; justify-content: center; margin: 0 0 16px; }
  #reactRow button { font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 6px 9px;
    border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); }
  #reactRow button:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-2px); }
  #reactRow button:disabled { opacity: 0.35; cursor: default; }
  #reactions { min-height: 46px; margin: 6px 0 12px; display: flex; gap: 14px;
    justify-content: center; align-items: center; }
  .reaction { font-size: 1.9rem; animation: react-pop 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
  .reaction.theirs { filter: drop-shadow(0 0 10px rgba(245,214,61,0.5)); }
  .reaction small { display: block; font-size: 0.52rem; letter-spacing: 2px; color: var(--dim);
    text-align: center; margin-top: 2px; }
  @keyframes react-pop { from { opacity: 0; transform: scale(0.3) rotate(-18deg); } to { opacity: 1; transform: none; } }

  /* Countdown: both boards are seeded identically, so they should also
     start at the same moment rather than whenever each page got the news. */
  #countdown { position: fixed; inset: 0; z-index: 16; display: none; pointer-events: none;
    align-items: center; justify-content: center; }
  #countdown.on { display: flex; }
  #countdown span { font-size: 6rem; font-weight: 800; letter-spacing: 6px; color: #f5d63d;
    text-shadow: 0 0 40px rgba(245,214,61,0.55), 0 6px 30px rgba(0,0,0,0.6); }
  #countdown span.tick { animation: count-tick 0.65s ease-out; }
  @keyframes count-tick {
    0% { opacity: 0; transform: scale(1.9); } 25% { opacity: 1; transform: scale(1); }
    75% { opacity: 1; } 100% { opacity: 0; transform: scale(0.85); }
  }

  /* Sparks, on a win only. They are absolutely positioned, so without a
     stacking order of its own the panel's content would sit under them. */
  #result .panel { position: relative; }
  #result .panel > *:not(#sparks) { position: relative; z-index: 1; }
  #sparks { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; border-radius: 16px; }
  #sparks i { position: absolute; bottom: -12px; width: 8px; height: 8px; border-radius: 2px;
    background: #45d9c8; animation: spark 1.6s ease-out forwards; }
  @keyframes spark {
    0% { opacity: 0; transform: translateY(0) rotate(0deg); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-260px) rotate(300deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logline, #result .panel, #resultTitle, #sparks i, #hud.hit, body.jolt, #flash.go,
    #dangerBar.armed #dangerFill, .reaction { animation: none; }
    #countdown span.tick { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="dangerBar"><div id="dangerFill"></div></div>
<div id="log"></div>
<div id="flash"></div>
<div id="countdown"><span id="countNum"></span></div>

<div id="hud">
  <div id="oppLabel">OPPONENT</div>
  <canvas id="oppCanvas" width="120" height="240"></canvas>
  <div id="pending"><span class="w">incoming</span> <b id="pendingN">0</b></div>
  <div id="sent">sent <span id="sentN">0</span></div>
</div>

<div class="overlay" id="lobby">
  <div class="panel">
    <h1>BlockStorm Versus</h1>
    <div class="sub">Two players, one bag of pieces. Clear lines, bury the other one.</div>

    <div class="row">
      <button class="btn" id="createBtn">Create room</button>
      <span style="color:var(--dim)">or</span>
      <input id="codeInput" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE">
      <button class="btn" id="joinBtn">Join</button>
    </div>

    <div id="codeBox" class="hidden">
      <div id="code">----</div>
      <div class="hint">Share the code — or just send the link.<br>Keep this page open: the room lives in this tab.</div>
      <div class="row">
        <button class="btn tiny" id="copyLinkBtn">🔗 Copy invite link</button>
        <button class="btn tiny" id="shareBtn" style="display:none">📤 Share</button>
        <button class="btn tiny" id="copyCodeBtn">Copy code</button>
      </div>
    </div>

    <div id="status"></div>
  </div>
</div>

<div class="overlay hidden" id="result">
  <div class="panel">
    <div id="sparks"></div>
    <h1 id="resultTitle">—</h1>
    <div class="sub" id="resultSub"></div>
    <div id="stats"></div>
    <div id="series" class="hidden"></div>
    <div id="reactions"></div>
    <div id="reactRow"></div>
    <div class="row">
      <button class="btn" id="rematchBtn">Rematch</button>
      <a class="btn" href="/blockstorm/">Back to BlockStorm</a>
    </div>
    <div id="resultStatus" class="hint" style="margin-top:14px"></div>
  </div>
</div>

<!-- The query is a cache buster: the transport gained a message type, and
     a browser holding the previous copy would run a page that cannot send
     it. Bump it whenever vs-net.js changes. -->
<script src="../vs-net.js?v=2"></script>
<!-- Boots the same Game as single-player and exposes window.PULSE_TETRIS. -->
<script type="module" src="../src/js/game.js"></script>

<script type="module">
  import { VersusMatch } from '../src/js/versus.js';
  import { isPerfectClear } from '../src/js/attack.js';

  const $ = (id) => document.getElementById(id);
  const game = window.PULSE_TETRIS;
  let match = null;
  let inviteLink = '';
  let started = false;

  const setStatus = (msg, isError) => {
    $('status').textContent = msg || '';
    $('status').classList.toggle('error', !!isError);
  };

  // ---- opponent board ------------------------------------------------
  // The wire format is one character per cell: '.' empty, 'g' garbage,
  // '#' anything else. 200 characters for a 10x20 board.
  const COLS = 10;
  let oppRows = [];

  function serializeBoard() {
    return game.grid.cells.map((row) =>
      row.map((c) => (c ? (c.garbage ? 'g' : '#') : '.')).join('')
    ).join('/');
  }

  function drawOpponent() {
    const cv = $('oppCanvas');
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!oppRows.length) return;
    const cw = cv.width / COLS;
    const ch = cv.height / oppRows.length;
    for (let r = 0; r < oppRows.length; r++) {
      for (let c = 0; c < COLS; c++) {
        const ch0 = oppRows[r][c];
        if (!ch0 || ch0 === '.') continue;
        ctx.fillStyle = ch0 === 'g' ? '#6b7280' : '#45d9c8';
        ctx.fillRect(c * cw + 0.5, r * ch + 0.5, cw - 1, ch - 1);
      }
    }
  }

  // ---- placing the opponent board ------------------------------------
  // The player's own board is wherever the renderer put it: centred, with
  // the sidebar beside it in landscape and underneath in portrait. So the
  // mini-board is measured off that rectangle — it sits in the wider of
  // the two gutters, at a cell size proportional to the real one, and
  // keeps its relation to the stack at any window size. When neither
  // gutter can hold it (a phone in portrait, where the board fills the
  // width) it degrades to a strip across the top of the board instead.
  const ROWS = 20;
  const GAP = 12;
  const MIN_CELL = 3;        // below this the stack is unreadable anyway
  const MIN_TEXT = 74;       // "incoming 0" has to fit without bleeding out

  function hudPlacement(L) {
    // The gutter is what is left beside the whole frame — board *and*
    // sidebar. In landscape the sidebar sits between them, so measuring
    // from the board alone would put this on top of the score.
    const frameLeft = Math.min(L.boardX, L.sidebarX);
    const frameRight = Math.max(L.boardX + L.boardWidth, L.sidebarX + L.sidebarWidth);
    const leftGutter = frameLeft;
    const rightGutter = L.width - frameRight;
    const onLeft = leftGutter >= rightGutter;
    const gutter = onLeft ? leftGutter : rightGutter;

    // The block claims the whole gutter, not just the width of the
    // mini-board: the counters underneath are text, and text that doesn't
    // fit its box runs out over the playfield.
    const avail = gutter - GAP * 2;
    const chrome = 60;        // label above, two counters below
    const cell = Math.min(L.cellSize * 0.45, avail / COLS, (L.boardHeight - chrome) / ROWS);

    if (cell >= MIN_CELL && avail >= MIN_TEXT) {
      const w = Math.round(cell * COLS);
      const h = Math.round(cell * ROWS);
      return {
        mode: 'gutter', w: w, h: h, blockW: Math.round(avail),
        left: Math.round(onLeft ? GAP : frameRight + GAP),
        top: Math.round(L.boardY + 20)
      };
    }

    const stripCell = Math.max(2, Math.min((L.boardWidth * 0.42) / COLS, (L.boardHeight * 0.16) / ROWS));
    const w = Math.round(stripCell * COLS);
    const h = Math.round(stripCell * ROWS);
    return { mode: 'strip', w: w, h: h, left: Math.round(L.boardX + 6), top: Math.round(L.boardY + 6) };
  }

  function placeHud() {
    const L = game.renderer && game.renderer.layout;
    if (!L) return;
    const p = hudPlacement(L);
    const hud = $('hud');
    const cv = $('oppCanvas');
    hud.classList.toggle('strip', p.mode === 'strip');
    hud.style.left = p.left + 'px';
    hud.style.top = p.top + 'px';
    hud.style.width = p.blockW ? p.blockW + 'px' : '';
    // The danger bar rides the board's edge; the callouts float over its
    // middle, where the eye already is.
    const bw = Math.max(5, Math.round(L.cellSize * 0.22));
    const bar = $('dangerBar');
    const outside = L.boardX - bw - 5;
    bar.style.left = (outside >= 2 ? outside : L.boardX + 3) + 'px';
    bar.style.top = Math.round(L.boardY) + 'px';
    bar.style.width = bw + 'px';
    bar.style.height = Math.round(L.boardHeight) + 'px';

    const log = $('log');
    log.style.left = Math.round(L.boardX) + 'px';
    log.style.width = Math.round(L.boardWidth) + 'px';
    log.style.top = Math.round(L.boardY + L.boardHeight * 0.34) + 'px';

    if (cv.width !== p.w || cv.height !== p.h) {
      cv.width = p.w;
      cv.height = p.h;
      drawOpponent();                 // resizing a canvas clears it
    }
  }

  // Runs after the engine's own resize handler, so the layout it reads is
  // the new one.
  window.addEventListener('resize', placeHud);
  window.addEventListener('orientationchange', () => setTimeout(placeHud, 60));

  function refreshHud() {
    $('pendingN').textContent = match ? match.pendingLines : 0;
    $('sentN').textContent = match ? match.sentLines : 0;
  }

  // ---- reactions -----------------------------------------------------
  // A versus board is read at a glance, so what matters has to be visible
  // without reading a number: how much is coming, whether it is armed,
  // and whether the last thing you did landed.

  const NAMES = ['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS'];

  function clearLabel(info, wasB2B, perfect) {
    const n = info.lines | 0;
    if (n <= 0) return null;
    if (perfect) return { text: 'PERFECT CLEAR', note: '' };
    let text = info.tSpin === 'full' ? 'T-SPIN ' + NAMES[n] : NAMES[n];
    const notes = [];
    if (wasB2B && (n === 4 || info.tSpin === 'full')) notes.push('BACK-TO-BACK');
    if ((info.combo | 0) > 1) notes.push('COMBO ' + info.combo);
    return { text: text, note: notes.join(' · ') };
  }

  function pushLog(text, note, kind) {
    const el = document.createElement('div');
    el.className = 'logline' + (kind ? ' ' + kind : '');
    el.textContent = text;
    if (note) {
      const s = document.createElement('small');
      s.textContent = note;
      el.appendChild(s);
    }
    const log = $('log');
    log.appendChild(el);
    // Three at a time is plenty; a fast combo would otherwise stack a wall.
    while (log.children.length > 3) log.removeChild(log.firstChild);
    setTimeout(() => el.remove(), 1400);
  }

  function replay(el, cls, ms) {
    el.classList.remove(cls);
    void el.offsetWidth;                // restart the animation
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), ms);
  }

  function flash(color) {
    const f = $('flash');
    f.style.background = color;
    replay(f, 'go', 600);
  }

  // Your attack landing on them.
  function reactSent(lines) {
    replay($('hud'), 'hit', 380);
    replay($('oppCanvas'), 'flash', 380);
    pushLog('▲ ' + lines, 'SENT', null);
  }

  // Garbage standing up on your own board.
  function reactHit(lines) {
    replay(document.body, 'jolt', 320);
    flash('rgba(232,91,108,0.45)');
    pushLog('▼ ' + lines, 'GARBAGE', 'inbound');
  }

  // The danger bar is driven by a frame loop rather than by events,
  // because what it shows is time passing, not something that happened.
  let fxRunning = false;
  function fxTick() {
    const bar = $('dangerBar');
    if (match && !match.finished) {
      const p = match.pendingLines;
      const frac = Math.min(1, p / 10);
      $('dangerFill').style.height = (frac * 100) + '%';
      const armed = match.incoming.length > 0 && match.incoming[0].readyAt <= Date.now();
      bar.classList.toggle('armed', armed);
    } else {
      $('dangerFill').style.height = '0%';
      bar.classList.remove('armed');
    }
    requestAnimationFrame(fxTick);
  }

  // ---- reactions -----------------------------------------------------
  // The only thing two strangers in a room code can say to each other.
  // Winner and loser get different offers: gloating and conceding are not
  // the same gesture.
  // No ZWJ sequences here: the receiving side trims what arrives, and a
  // trimmed compound emoji renders as rubble.
  const EMOJI = {
    win:  ['🏆', '😎', '🔥', '👏', '🤝'],
    lose: ['😤', '😭', '👏', '🤝', '🔁'],
    draw: ['🤝', '😅', '🔥', '👏', '🔁'],
  };
  const series = { me: 0, them: 0, draws: 0 };
  let countedAs = null;        // what this match has been scored as so far

  function showReaction(emoji, mine) {
    const box = $('reactions');
    const el = document.createElement('div');
    el.className = 'reaction' + (mine ? ' mine' : ' theirs');
    el.textContent = emoji;
    const tag = document.createElement('small');
    tag.textContent = mine ? 'YOU' : 'THEM';
    el.appendChild(tag);
    // One each: a second from the same side replaces the first.
    const existing = box.querySelector(mine ? '.mine' : '.theirs');
    if (existing) existing.remove();
    if (mine) box.appendChild(el); else box.insertBefore(el, box.firstChild);

    // The box lives in the result panel. If that panel is down — they hit
    // rematch a moment before you reacted, or the reaction is simply
    // late — the emoji would land somewhere nobody can see. Say it over
    // the board instead, so a sent reaction is never silently swallowed.
    if (!mine && $('result').classList.contains('hidden')) pushLog(emoji, 'THEM', 'inbound');
  }

  function buildReactions(outcome) {
    const row = $('reactRow');
    row.innerHTML = '';
    (EMOJI[outcome] || EMOJI.lose).forEach((e) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = e;
      b.setAttribute('aria-label', 'react ' + e);
      b.addEventListener('click', () => {
        showReaction(e, true);
        // Never swallow this. A page left open from an older deploy has
        // no VSNet.react at all, and the sender would otherwise see their
        // own emoji appear and assume it went out.
        let sent = false;
        try {
          if (VSNet && typeof VSNet.react === 'function') { VSNet.react({ e: e }); sent = true; }
        } catch (err) { sent = false; }
        $('resultStatus').textContent = sent ? '' : "Couldn't send that — reload the page and try again.";
        [...row.children].forEach((c) => { c.disabled = true; });
      });
      row.appendChild(b);
    });
  }

  // ---- countdown -----------------------------------------------------
  // Both sides hear about the start a round trip apart, and the engine
  // would otherwise begin dropping the moment each page found out. Three
  // seconds of nothing is the cheapest way to make the two boards start
  // together — and it gives you a moment to look at the first piece.
  let countTimer = null;

  function runCountdown() {
    clearTimeout(countTimer);
    const box = $('countdown');
    const num = $('countNum');
    game.paused = true;                 // input.js already bails while paused
    box.classList.add('on');

    let n = 3;
    const step = () => {
      if (n > 0) {
        num.textContent = n;
        replay(num, 'tick', 650);
        n--;
        countTimer = setTimeout(step, 700);
        return;
      }
      num.textContent = 'GO';
      replay(num, 'tick', 650);
      countTimer = setTimeout(() => box.classList.remove('on'), 520);
      resumeEngine();
    };
    step();
  }

  function resumeEngine() {
    game.paused = false;
    game.lastTime = performance.now();  // or gravity jumps by the whole pause
    requestAnimationFrame(game.loop);
  }

  // ---- the match -----------------------------------------------------
  function beginMatch(seed) {
    match = new VersusMatch({
      grid: game.grid,
      send: (type, payload) => {
        if (type === 'attack') VSNet.attack(payload);
        else if (type === 'topout') VSNet.topout(payload);
      },
    });

    game.bagSeed = seed || null;
    game.onLock = (info) => {
      // Read these before handleLock: it flips back-to-back and may stand
      // garbage up on the board, which changes both answers.
      const wasB2B = match.backToBack;
      const perfect = (info.lines | 0) > 0 && isPerfectClear(game.grid.cells);
      const pendingBefore = match.pendingLines;

      const res = match.handleLock(info);

      const label = clearLabel(info, wasB2B, perfect);
      if (label) pushLog(label.text, label.note, null);
      if (res.sent > 0) reactSent(res.sent);
      const cancelled = Math.max(0, pendingBefore - match.pendingLines - res.applied);
      if (cancelled > 0) pushLog('✕ ' + cancelled, 'CANCELLED', 'cancel');
      if (res.applied > 0) reactHit(res.applied);

      VSNet.board({ b: serializeBoard() });
      refreshHud();
    };

    // The engine's own game-over path: my stack reached the ceiling.
    window.showGameOver = () => { if (match) match.lose('topout'); showResult('lose', 'Your stack hit the ceiling.'); };

    game.setGameMode('marathon');
    game.setStartLevel(0);
    game.restart();

    started = true;
    $('lobby').classList.add('hidden');
    $('result').classList.add('hidden');
    $('hud').classList.add('on');
    $('dangerBar').classList.add('on');
    $('result').classList.remove('win', 'lose');
    $('log').innerHTML = '';
    $('sparks').innerHTML = '';
    $('reactions').innerHTML = '';
    $('reactRow').innerHTML = '';
    countedAs = null;
    placeHud();
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxTick); }
    runCountdown();
    oppRows = [];
    drawOpponent();
    refreshHud();
  }

  // outcome: 'win' | 'lose' | 'draw'
  function showResult(outcome, why) {
    const won = outcome === 'win';
    game.running = false;
    game.gameOver = true;
    $('dangerBar').classList.remove('on', 'armed');

    $('resultTitle').textContent = won ? 'You win' : outcome === 'draw' ? 'Draw' : 'You lose';
    $('resultSub').textContent = why || '';
    $('resultStatus').textContent = '';

    const sent = match ? match.sentLines : 0;
    const took = match ? match.receivedLines : 0;
    const best = game.stats ? (game.stats.maxCombo | 0) : 0;
    $('stats').innerHTML =
      'sent <b>' + sent + '</b> &nbsp;·&nbsp; took <b>' + took + '</b>' +
      ' &nbsp;·&nbsp; cleared <b>' + (game.lines | 0) + '</b>' +
      (best > 1 ? ' &nbsp;·&nbsp; best combo <b>' + best + '</b>' : '');

    // A single match says little; the series is what people play for.
    // A match can report twice: you top out, it is scored as a loss, and
    // then their topout arrives and turns the whole thing into a draw. So
    // the tally has to be revisable, not write-once — otherwise a draw is
    // quietly recorded as a defeat for both players.
    if (countedAs !== outcome) {
      if (countedAs === 'win') series.me--;
      else if (countedAs === 'lose') series.them--;
      else if (countedAs === 'draw') series.draws--;

      if (outcome === 'win') series.me++;
      else if (outcome === 'lose') series.them++;
      else series.draws++;              // a draw belongs to neither side
      countedAs = outcome;
    }
    const s = $('series');
    if (series.me + series.them + series.draws > 1) {
      s.innerHTML = 'SERIES &nbsp;<b>' + series.me + ' – ' + series.them + '</b>' +
        (series.draws ? ' &nbsp;(' + series.draws + ' drawn)' : '');
      s.classList.remove('hidden');
    } else {
      s.classList.add('hidden');
    }

    $('result').classList.remove('win', 'lose', 'draw');
    $('result').classList.add(outcome);
    buildReactions(outcome);

    flash(won ? 'rgba(69,217,200,0.4)' : outcome === 'draw' ? 'rgba(245,214,61,0.4)' : 'rgba(232,91,108,0.5)');
    if (!won) replay(document.body, 'jolt', 340);

    const sparks = $('sparks');
    sparks.innerHTML = '';
    if (won) {
      const colors = ['#45d9c8', '#f5d63d', '#9b8cff', '#ff8da1'];
      for (let i = 0; i < 22; i++) {
        const s = document.createElement('i');
        s.style.left = Math.round(Math.random() * 96) + '%';
        s.style.background = colors[i % colors.length];
        s.style.animationDelay = (Math.random() * 0.7).toFixed(2) + 's';
        s.style.animationDuration = (1.3 + Math.random() * 0.8).toFixed(2) + 's';
        sparks.appendChild(s);
      }
    }

    $('result').classList.remove('hidden');
  }

  // ---- transport wiring ----------------------------------------------
  VSNet.on('opponentJoined', (d) => {
    clearJoinTimeout();
    setStatus('Opponent joined — starting…');
    beginMatch(d && d.seed);
  });

  VSNet.on('attack', (d) => {
    if (!match) return;
    const before = match.pendingLines;
    match.receive('attack', d);
    const queued = match.pendingLines - before;
    if (queued > 0) pushLog('▼ ' + queued, 'INCOMING', 'inbound');
    refreshHud();
  });

  VSNet.on('board', (d) => {
    if (!d || typeof d.b !== 'string') return;
    oppRows = d.b.split('/');
    drawOpponent();
  });

  VSNet.on('topout', () => {
    if (!match) { showResult('win', 'They topped out.'); return; }
    match.opponentLost();
    // Their news can arrive after we have already lost — the two topouts
    // crossed. Then nobody won, and the panel must not be rewritten into
    // a win on top of the loss we just showed.
    if (match.drew) showResult('draw', 'You both topped out.');
    else if (match.won === false) return;        // we lost; this changes nothing
    else showResult('win', 'They topped out.');
  });

  // Only ever rendered as text in a span, and only while the result panel
  // is up — nothing downstream reads it.
  VSNet.on('react', (d) => {
    const e = d && typeof d.e === 'string' ? d.e.slice(0, 4) : '';
    if (e) showReaction(e, false);
  });

  VSNet.on('rematch', (d) => {
    if (d && d.seed) beginMatch(d.seed);
  });

  VSNet.on('left', () => {
    clearJoinTimeout();
    if (!started) { setStatus('The other player left.', true); return; }
    if (match && match.finished) return;         // the match already has a result
    showResult('win', 'They left the match.');
  });

  // ---- lobby ----------------------------------------------------------
  if (window.VSNet && VSNet.preload) VSNet.preload();

  $('createBtn').addEventListener('click', function () {
    this.disabled = true; $('joinBtn').disabled = true;
    setStatus('Creating room…');
    VSNet.host().then((code) => {
      $('code').textContent = code;
      inviteLink = location.origin + location.pathname + '?join=' + code;
      if (navigator.share) $('shareBtn').style.display = '';
      $('codeBox').classList.remove('hidden');
      setStatus('Waiting for a friend to join…');
    }).catch(() => {
      setStatus('Could not create a room — try again.', true);
      this.disabled = false; $('joinBtn').disabled = false;
    });
  });

  // A guest who mistypes a code subscribes to a channel nobody is
  // listening on, and vs-net.js keeps knocking every 1.5s forever. With
  // no limit the page just says "waiting for the host" for all eternity,
  // which looks exactly like a hang. Give up, say so, and let them try
  // again — the knocking has to stop too, or the old room code keeps
  // calling in the background.
  const JOIN_TIMEOUT_MS = 12000;
  let joinTimeout = null;

  function clearJoinTimeout() {
    if (joinTimeout) { clearTimeout(joinTimeout); joinTimeout = null; }
  }

  function joinFailed(msg) {
    clearJoinTimeout();
    try { VSNet.leave(); } catch (e) {}
    setStatus(msg, true);
    $('createBtn').disabled = false;
    $('joinBtn').disabled = false;
  }

  function doJoin() {
    const code = ($('codeInput').value || '').trim().toUpperCase();
    if (code.length < 4) { setStatus('Enter the 4-character code.', true); return; }
    $('createBtn').disabled = true; $('joinBtn').disabled = true;
    setStatus('Connecting…');
    clearJoinTimeout();

    VSNet.join(code).then(() => {
      setStatus('Joined — waiting for the host…');
      clearJoinTimeout();
      joinTimeout = setTimeout(() => {
        if (started || VSNet.connected) return;
        joinFailed('No answer from room ' + code + ' — check the code, or ask them to open their page again.');
      }, JOIN_TIMEOUT_MS);
    }).catch(() => {
      joinFailed('Could not join — check the code.');
    });
  }
  $('joinBtn').addEventListener('click', doJoin);
  $('codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); });

  $('copyLinkBtn').addEventListener('click', () => {
    if (!inviteLink) return;
    const done = () => setStatus('Link copied — send it to a friend!');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(inviteLink).then(done).catch(() => window.prompt('Copy this link:', inviteLink));
    } else {
      window.prompt('Copy this link:', inviteLink);
    }
  });

  $('copyCodeBtn').addEventListener('click', () => {
    const code = $('code').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => setStatus('Code copied!')).catch(() => {});
  });

  $('shareBtn').addEventListener('click', () => {
    if (inviteLink && navigator.share) {
      navigator.share({ title: 'BlockStorm Versus', text: 'Play me — join my room!', url: inviteLink }).catch(() => {});
    }
  });

  // Only the host can set a new seed; the guest waits to be told.
  $('rematchBtn').addEventListener('click', () => {
    if (VSNet.role === 'host') {
      const seed = VSNet.newSeed();
      VSNet.rematch({ seed });
      beginMatch(seed);
    } else {
      $('resultStatus').textContent = 'Waiting for the host to start another…';
      VSNet.rematch({});
    }
  });

  // Invite links: /blockstorm/versus/?join=CODE drops you straight into the room.
  try {
    const joinCode = (new URLSearchParams(location.search).get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (joinCode.length === 4) {
      history.replaceState(null, '', location.pathname);
      $('codeInput').value = joinCode;
      doJoin();
    }
  } catch (e) {}

  window.addEventListener('beforeunload', () => { try { VSNet.leave(); } catch (e) {} });

  // Exposed for the smoke test, which has no route to Supabase and drives
  // the match through a fake transport instead.
  window.__versus = {
    beginMatch,
    get match() { return match; },
    serializeBoard,
    setOpponentBoard: (s) => { oppRows = s.split('/'); drawOpponent(); },
    placeHud,
    hudPlacement: () => hudPlacement(game.renderer.layout),
  };
</script>
</body>
</html>
